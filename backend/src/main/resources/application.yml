spring:
  application:
    name: vednex-business-suite

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vednex_business_suite?options=-c%20TimeZone=UTC}
    username: ${DB_USERNAME:vednex}
    password: ${DB_PASSWORD:local_dev_only_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when_authorized
