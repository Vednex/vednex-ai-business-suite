services:
  postgres:
    image: postgres:17
    container_name: vednex-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vednex_business_suite}
      POSTGRES_USER: ${POSTGRES_USER:-vednex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_password}
      TZ: UTC

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U vednex -d vednex_business_suite"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
