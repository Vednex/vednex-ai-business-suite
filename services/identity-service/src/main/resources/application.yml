spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]

  application:
    name: identity-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity_db?options=-c%20TimeZone=UTC}
    username: ${DB_USERNAME:vednex}
    password: ${DB_PASSWORD:vednex@123}
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:vednex}
    password: ${RABBITMQ_PASSWORD:vednex}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  backend-url: ${APP_BACKEND_URL:http://localhost:8081}
  jwt:
    private-key: ${JWT_PRIVATE_KEY:}
    private-key-file: ${JWT_PRIVATE_KEY_FILE:}
    public-key: ${JWT_PUBLIC_KEY:}
    public-key-file: ${JWT_PUBLIC_KEY_FILE:}
    issuer: ${JWT_ISSUER:vednex-identity-service}
    audience: ${JWT_AUDIENCE:vednex-business-suite}
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  security:
    max-failed-login-attempts: ${MAX_FAILED_LOGIN_ATTEMPTS:5}
    verification-token-expiration-hours: ${VERIFICATION_TOKEN_EXPIRATION_HOURS:24}
    password-reset-token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:30}
    invitation-expiration-days: ${INVITATION_EXPIRATION_DAYS:7}
    resend-verification-cooldown-minutes: ${RESEND_VERIFICATION_COOLDOWN_MINUTES:5}
  cookies:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
  events:
    exchange: ${EVENTS_EXCHANGE:vednex.events}
    dead-letter-exchange: ${EVENTS_DLX:vednex.events.dlx}
    archive-queue: ${EVENTS_ARCHIVE_QUEUE:vednex.events.identity.archive}
    dead-letter-queue: ${EVENTS_DLQ:vednex.events.dlq}
    producer: ${EVENTS_PRODUCER:identity-service}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}
    batch-size: ${OUTBOX_BATCH_SIZE:25}
    max-retries: ${OUTBOX_MAX_RETRIES:10}
    retry-base-seconds: ${OUTBOX_RETRY_BASE_SECONDS:30}
    publish-confirm-timeout-ms: ${OUTBOX_PUBLISH_CONFIRM_TIMEOUT_MS:5000}

server:
  port: ${SERVER_PORT:8081}

management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: when_authorized
