spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]

  application:
    name: notification-service

  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification_db?options=-c%20TimeZone=UTC}
    username: ${NOTIFICATION_DB_USERNAME:${POSTGRES_USER:vednex}}
    password: ${NOTIFICATION_DB_PASSWORD:${POSTGRES_PASSWORD:vednex@123}}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:vednex}
    password: ${RABBITMQ_PASSWORD:vednex}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        default-requeue-rejected: false

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:no-reply@vednex.local}
    log-token-links: ${MAIL_LOG_TOKEN_LINKS:false}
  events:
    exchange: ${EVENTS_EXCHANGE:vednex.events}
    dead-letter-exchange: ${EVENTS_DLX:vednex.events.dlx}
    dead-letter-queue: ${EVENTS_DLQ:vednex.events.dlq}
  notifications:
    identity-queue: ${NOTIFICATION_IDENTITY_QUEUE:vednex.notification.identity}
    consumer-name: ${NOTIFICATION_CONSUMER_NAME:notification-service}
    email-max-attempts: ${NOTIFICATION_EMAIL_MAX_ATTEMPTS:3}
    email-retry-base-ms: ${NOTIFICATION_EMAIL_RETRY_BASE_MS:500}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
